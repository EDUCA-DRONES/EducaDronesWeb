# Arquivos do GitHub Actions
ci-cd:
  - changed-files:
      - any-glob-to-any-file: '.github/**/*'

# Configurações principais e rotas do Django
core:
  - changed-files:
      - any-glob-to-any-file: 
        - 'EducaDronesWeb/**/*'
        - 'manage.py'
        - '.env.example'

# Apps específicos do projeto
app-emails:
  - changed-files:
      - any-glob-to-any-file: 'emails/**/*'

app-livro-visitas:
  - changed-files:
      - any-glob-to-any-file: 'livro_de_visitas/**/*'

app-noticias:
  - changed-files:
      - any-glob-to-any-file: 'noticias/**/*'

app-website:
  - changed-files:
      - any-glob-to-any-file: 'website/**/*'

# Arquivos de interface (HTML, CSS, JS, Imagens)
frontend:
  - changed-files:
      - any-glob-to-any-file: 
        - 'templates/**/*'
        - 'static/**/*'

# Arquivos de mídia
media:
  - changed-files:
      - any-glob-to-any-file: 'media/**/*'

# Controle de dependências do Python
dependencies:
  - changed-files:
      - any-glob-to-any-file: 'requirements.txt'

# Documentação do projeto
documentation:
  - changed-files:
      - any-glob-to-any-file: 'README.md'