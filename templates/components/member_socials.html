<div class="member-card__social" aria-label="Redes sociais de {{ member_name }}">
    <a href="{{ instagram_url|default:'#' }}" aria-label="Instagram de {{ member_name }}"{% if instagram_url and instagram_url != '#' %} target="_blank" rel="noopener noreferrer"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="member-card__social-dot" cx="17.4" cy="6.7" r="1"></circle>
        </svg>
    </a>

    <a href="{{ linkedin_url|default:'#' }}" aria-label="LinkedIn de {{ member_name }}"{% if linkedin_url and linkedin_url != '#' %} target="_blank" rel="noopener noreferrer"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 9.5V20"></path>
            <path d="M6.5 5.2v.1"></path>
            <path d="M11 20V9.5"></path>
            <path d="M11 14a4.5 4.5 0 0 1 9 0v6"></path>
        </svg>
    </a>
</div>
